name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Work out the version and the tag
        id: meta
        shell: bash
        run: |
          version=$(python -c "import version; print(version.__version__)")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            if [ "$tag" != "v$version" ]; then
              echo "::error::Tag $tag does not match version.py (v$version). Bump version.py first."
              exit 1
            fi
          else
            tag="v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # A fixed asset name, so the website can link
          # releases/latest/download/<name> and never go stale. The version is
          # inside the archive and on the release page.
          echo "asset=ExplorerManager-windows-x64.zip" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build ExplorerManager.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name ExplorerManager
          --icon assets\icon.ico
          --add-data "assets;assets"
          main.py

      # Shipped as an archive rather than a bare .exe: browsers and antivirus
      # engines flag a freshly downloaded, unsigned executable far more readily
      # than the same binary inside a zip.
      - name: Pack the executable
        shell: bash
        run: |
          cd dist
          7z a "${{ steps.meta.outputs.asset }}" ExplorerManager.exe
          certutil -hashfile "${{ steps.meta.outputs.asset }}" SHA256 \
            | sed -n '2p' | tr -d '\r' \
            | awk -v f="${{ steps.meta.outputs.asset }}" '{print $0"  "f}' \
            > "${{ steps.meta.outputs.asset }}.sha256"
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: ExplorerManager-windows-x64
          path: |
            dist/${{ steps.meta.outputs.asset }}
            dist/${{ steps.meta.outputs.asset }}.sha256
          if-no-files-found: error

      - name: Attach it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          ASSET: dist/${{ steps.meta.outputs.asset }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
          else
            gh release create "$TAG" "$ASSET" "$ASSET.sha256" \
              --title "Explorer Manager $TAG" --generate-notes
          fi

      # Every download button on the site is
      # releases/latest/download/<asset>, resolved by GitHub at click time. A
      # release that ends without that exact name under it leaves the site
      # serving a 404, so the run does not finish until the link is real.
      - name: Check the link the website uses
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          set -euo pipefail

          position=$(gh release view "$TAG" --json assets \
            --jq "[.assets[].name] | index(\"$ASSET\")")
          if [ -z "$position" ] || [ "$position" = "null" ]; then
            echo "::error::$ASSET is not attached to $TAG."
            exit 1
          fi

          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name || echo "")
          if [ "$latest" != "$TAG" ]; then
            echo "::warning::The newest release is ${latest:-unknown}, not $TAG, so the site keeps serving that one."
            exit 0
          fi

          url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/$ASSET"
          for attempt in 1 2 3; do
            code=$(curl -sIL -o /dev/null -w '%{http_code}' "$url")
            if [ "$code" = "200" ]; then
              echo "$url -> $code"
              exit 0
            fi
            echo "$url -> $code (attempt $attempt)"
            sleep 5
          done
          echo "::error::The website's download link does not resolve yet."
          exit 1
